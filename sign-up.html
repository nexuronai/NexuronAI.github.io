</main>

<script>

const GITHUB_PAGES =
    "https://nexuronai.github.io";


window.addEventListener(
    "load",
    async () => {

        try {

            await Clerk.load({
                ui: {
                    ClerkUI:
                        window.__internal_ClerkUICtor
                }
            });


            Clerk.mountSignUp(
                document.getElementById(
                    "clerk-sign-up"
                ),
                {

                    routing: "hash",

                    signInUrl:
                        `${GITHUB_PAGES}/sign-in.html`,

                    forceRedirectUrl:
                        `${GITHUB_PAGES}/chat.html`,

                    signInForceRedirectUrl:
                        `${GITHUB_PAGES}/chat.html`,

                    appearance: {

                        variables: {

                            colorPrimary:
                                "#6366f1",

                            colorBackground:
                                "#111116",

                            colorText:
                                "#ffffff",

                            colorTextSecondary:
                                "#9ca3af",

                            colorInputBackground:
                                "#0b0b0f",

                            colorInputText:
                                "#ffffff",

                            borderRadius:
                                "12px"

                        }

                    }

                }
            );

        } catch (error) {

            console.error(
                "CLERK ERROR:",
                error
            );

        }

    }
);

</script>
